name: Task
description: A unit of work with acceptance criteria
labels: [task]
body:
  - type: input
    id: spec
    attributes:
      label: Spec reference
      description: File and anchor, for example docs/spec/10-budget.md#reconciliation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One Given / When / Then per line.
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Dependencies
