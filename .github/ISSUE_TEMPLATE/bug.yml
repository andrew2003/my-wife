name: Bug report
description: Something behaves differently from the spec
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Reference the spec section if there is one.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, keys and personal data first.
